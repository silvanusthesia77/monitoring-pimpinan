services:
  mysql:
    image: mysql:8.4
    container_name: agenda-monitor-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: agenda_monitor
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: agenda-monitor-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PORT: 8080
      MYSQL_DSN: root:root@tcp(mysql:3306)/agenda_monitor?parseTime=true&multiStatements=true
    ports:
      - "8080:8080"
    volumes:
      - uploads:/app/uploads

volumes:
  mysql_data:
  uploads:
